version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: inventory_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  web:
    build: .
    container_name: inventory_web
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=app_user
      - DB_PASS=secret
      - DB_NAME=inventory_db
    depends_on:
      - db
    command: >
      sh -c "python migrate.py --db-host db --db-user app_user --db-pass secret --db-name inventory_db &&
             python app.py --interface 0.0.0.0 --port 5000 --db-host db --db-user app_user --db-pass secret --db-name inventory_db"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: inventory_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
